[project]
name = "scholarsphere"
version = "1.0.0"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi==0.117.1",
    "uvicorn==0.36.0",
    "python-multipart==0.0.20",
    "torch",
    "transformers==4.36.2",
    "sentence-transformers==3.0.1",
    "sentencepiece==0.2.1",
    "keybert==0.9.0",
    "scikit-learn==1.8.0",
    "numpy==2.4.2",
    "PyPDF2==3.0.1",
    "python-docx==1.2.0",
    "nltk==3.9.2",
    "requests==2.32.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }